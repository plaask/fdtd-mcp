# fdtd-mcp-dsh-plugin — DSH bundle patch layer.
#
# Inserts one @deepseek-ai/dsh-mcp-client instance that spawns the fdtd-mcp
# stdio server. After this layer loads, the model sees the FDTD tools as
# native tools named `mcp__fdtd__<tool>` (e.g. mcp__fdtd__execute,
# mcp__fdtd__run, mcp__fdtd__model_add, ...).
#
# Paths below mirror .mcp.json (the Claude Code registration). Edit them here
# if your Anaconda Python or Lumerical installation lives elsewhere.

- insert:
    - id: mcp-fdtd
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fdtd
        transport: stdio
        command: D:/coding/anaconda3/python.exe
        args:
          - '-m'
          - 'fdtd_mcp.server'
        env:
          PYTHONPATH: D:/project/fdtd-mcp
          LUMERICAL_HOME: D:/Software/Lumerical/v202
        cwd: D:/project/fdtd-mcp
        # Lumerical may be unavailable at boot time; keep the GUI alive and
        # just skip tool registration when the server cannot start.
        failOnStartupError: false
