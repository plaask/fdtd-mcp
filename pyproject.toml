[project]
name = "fdtd-mcp"
version = "0.1.0"
description = "MCP server for Lumerical FDTD automation"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FDTD MCP contributors"},
]
keywords = ["mcp", "fdtd", "lumerical", "simulation", "photonics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = ["mcp"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fdtd-mcp = "fdtd_mcp.server:main"

[project.urls]
Homepage = "https://github.com/plaask/fdtd-mcp"
Repository = "https://github.com/plaask/fdtd-mcp"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
fdtd_mcp = ["cheatsheet/*.json", "dispatch.json"]

[tool.setuptools.packages.find]
include = ["fdtd_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite runs against tests/fake_engine.py and needs no Lumerical
# installation. `-m "not live"` keeps the real-engine smoke test out of the way;
# run it explicitly with FDTD_MCP_LIVE=1.
addopts = "-m 'not live'"
markers = [
    "live: drives a real Lumerical engine (set FDTD_MCP_LIVE=1 and LUMERICAL_HOME)",
]
